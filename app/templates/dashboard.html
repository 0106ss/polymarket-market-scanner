{% extends "base.html" %}{% block title %}市场监控总览{% endblock %}
{% block content %}
<section class="statusline"><span id="system-pill" class="pill waiting">正在检查系统</span><span id="last-update">等待公开行情</span></section>
<section class="cards">
  <article><label>活跃市场读取</label><strong id="active-markets">—</strong><small>Gamma API 本轮结果</small></article>
  <article><label>标准二元市场</label><strong id="binary-markets">—</strong><small>已通过扫描条件</small></article>
  <article><label>订阅 Token</label><strong id="subscribed-tokens">—</strong><small>公开 Market Channel</small></article>
  <article><label>当前有效机会</label><strong id="opportunity-count">—</strong><small>已扣费用与缓冲</small></article>
  <article><label>模拟交易记录</label><strong id="paper-count">—</strong><small>非真实成交</small></article>
  <article><label>累计预计模拟收益</label><strong id="paper-profit">—</strong><small>USDC · 模拟值</small></article>
</section>
<section class="grid two">
  <article class="panel"><h2>数据链路</h2><div id="connections" class="connections"></div></article>
  <article class="panel"><h2>运行状态</h2><dl id="runtime"></dl></article>
</section>
<section class="panel"><div class="panel-head"><h2>当前市场快照</h2><a class="button ghost" href="/opportunities">查看机会</a></div><div class="table-wrap"><table><thead><tr><th>市场</th><th>流动性</th><th>成交量</th><th>费用</th><th>计算状态</th></tr></thead><tbody id="market-preview"><tr><td colspan="5" class="empty">正在读取真实公开数据…</td></tr></tbody></table></div></section>
{% endblock %}

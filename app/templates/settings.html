{% extends "base.html" %}{% block title %}扫描设置{% endblock %}
{% block content %}<section class="panel narrow"><form id="settings-form"><label>最低预计净利润（USDC）<input name="minimum_net_profit" type="number" step="0.01" min="0"></label><label>最低预计净收益率（小数）<input name="minimum_net_roi" type="number" step="0.001" min="0" max="1"></label><label>默认模拟数量<input name="default_quantity" type="number" step="1" min="0.000001"></label><label>滑点缓冲率<input name="slippage_rate" type="number" step="0.001" min="0" max="0.25"></label><label>安全缓冲率<input name="safety_rate" type="number" step="0.001" min="0" max="0.25"></label><button class="button" type="submit">保存设置</button><span id="settings-result"></span></form></section>{% endblock %}
